name: Bootstrap source v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize source archive
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import shutil
          import tarfile
          from pathlib import Path

          repo = Path.cwd()
          parts = sorted((repo / ".bootstrap").glob("part-*"))
          if len(parts) != 22:
              raise SystemExit(f"expected 22 archive parts, found {len(parts)}")

          archive = Path("/tmp/CPUBench-source.tar.xz")
          with archive.open("wb") as output:
              for part in parts:
                  output.write(part.read_bytes())

          print(f"archive bytes={archive.stat().st_size}")
          print(f"archive sha256={hashlib.sha256(archive.read_bytes()).hexdigest()}")

          extracted = Path("/tmp/cpubench-source")
          shutil.rmtree(extracted, ignore_errors=True)
          extracted.mkdir(parents=True)
          with tarfile.open(archive, mode="r:xz") as bundle:
              bundle.extractall(extracted, filter="data")

          candidates = list(extracted.rglob("pyproject.toml"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one pyproject.toml, found {candidates}")
          source = candidates[0].parent
          print(f"source root={source}")

          # GitHub's workflow token may write repository contents but cannot create,
          # update, or delete workflow files. Preserve the current workflow directory
          # exactly; the connector will install the tested CI workflow afterward.
          for child in list(repo.iterdir()):
              if child.name in {".git", ".github"}:
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          github_dir = repo / ".github"
          github_dir.mkdir(exist_ok=True)
          for child in list(github_dir.iterdir()):
              if child.name == "workflows":
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in source.iterdir():
              if child.name == ".github":
                  for github_child in child.iterdir():
                      if github_child.name == "workflows":
                          continue
                      target = github_dir / github_child.name
                      if github_child.is_dir():
                          shutil.copytree(github_child, target, symlinks=True)
                      else:
                          shutil.copy2(github_child, target)
                  continue

              target = repo / child.name
              if child.is_dir():
                  shutil.copytree(child, target, symlinks=True)
              else:
                  shutil.copy2(child, target)

          if not (repo / "pyproject.toml").is_file():
              raise SystemExit("materialized tree has no pyproject.toml")

      - name: Commit exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish CPUBench evidence campaign alpha"
          git push origin HEAD:main
