name: Bootstrap source v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize source archive without workflow mutations
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import shutil
          import tarfile
          from pathlib import Path

          repo = Path.cwd()
          parts = sorted((repo / ".bootstrap").glob("part-*"))
          if len(parts) != 22:
              raise SystemExit(f"expected 22 archive parts, found {len(parts)}")

          archive = Path("/tmp/CPUBench-source.tar.xz")
          with archive.open("wb") as output:
              for part in parts:
                  output.write(part.read_bytes())

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          print(f"archive bytes={archive.stat().st_size}")
          print(f"archive sha256={digest}")

          extracted = Path("/tmp/cpubench-source")
          shutil.rmtree(extracted, ignore_errors=True)
          extracted.mkdir(parents=True)
          with tarfile.open(archive, mode="r:xz") as bundle:
              bundle.extractall(extracted, filter="data")

          candidates = list(extracted.rglob("pyproject.toml"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one pyproject.toml, found {candidates}")
          source = candidates[0].parent
          print(f"source root={source}")

          # Preserve the Git database, bootstrap payload, and existing workflow
          # files. The GitHub Actions token may write repository contents but
          # cannot create or replace workflow files. The connector publishes
          # the final CI workflow after this source commit lands.
          preserved = {
              repo / ".git",
              repo / ".bootstrap",
              repo / ".github",
          }
          for child in list(repo.iterdir()):
              if child in preserved:
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          # Replace .github content except workflows, which remain byte-for-byte
          # unchanged during the Actions-authored commit.
          source_github = source / ".github"
          target_github = repo / ".github"
          target_github.mkdir(exist_ok=True)
          for child in list(target_github.iterdir()):
              if child.name == "workflows":
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          if source_github.is_dir():
              for child in source_github.iterdir():
                  if child.name == "workflows":
                      continue
                  target = target_github / child.name
                  if child.is_dir():
                      shutil.copytree(child, target, symlinks=True)
                  else:
                      shutil.copy2(child, target)

          for child in source.iterdir():
              if child.name == ".github":
                  continue
              target = repo / child.name
              if child.is_dir():
                  shutil.copytree(child, target, symlinks=True)
              else:
                  shutil.copy2(child, target)

          if not (repo / "pyproject.toml").is_file():
              raise SystemExit("materialized tree has no pyproject.toml")

      - name: Commit exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Steven Zimmerman, CPA"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish CPUBench evidence campaign alpha"
          git push origin HEAD:main
