name: Apply timer review fixes

on:
  push:
    branches: [feat/timer-qualification]
    paths:
      - ".bootstrap-update/**"
      - ".github/workflows/apply-timer-review-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/timer-qualification

      - name: Verify and apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap-update/timer-review-fixes.patch.xz ]]; then
            echo "Patch already applied"
            exit 0
          fi
          echo "48027c7c275254321c04edc1fc4c8a9ee1c4ead98f031294e01db9db069bfe18  .bootstrap-update/timer-review-fixes.patch.xz" | sha256sum -c -
          xz -dc .bootstrap-update/timer-review-fixes.patch.xz > /tmp/timer-review-fixes.patch
          git apply --check /tmp/timer-review-fixes.patch
          git apply /tmp/timer-review-fixes.patch
          rm -rf .bootstrap-update

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: fail timer qualification closed"
          git push origin HEAD:feat/timer-qualification
