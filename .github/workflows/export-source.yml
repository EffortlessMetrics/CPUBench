name: Export source

on:
  push:
    branches: [feat/timer-qualification]
    paths:
      - ".github/workflows/export-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=cpubench-feature-source.tar.gz \
            -czf cpubench-feature-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cpubench-feature-source
          path: cpubench-feature-source.tar.gz
          if-no-files-found: error
