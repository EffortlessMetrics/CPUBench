name: Apply timer qualification patch

on:
  push:
    branches: [feat/timer-qualification]
    paths:
      - ".bootstrap-update/**"
      - ".github/workflows/apply-timer-qualification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/timer-qualification

      - name: Reassemble and apply tested patch
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G ".bootstrap-update/timer-part-*" > /dev/null; then
            echo "Patch already applied"
            exit 0
          fi
          cat .bootstrap-update/timer-part-* > /tmp/timer.patch.xz
          echo "fdd8028da23388ee6283062a02aa7c8e689f284b1903282460d76991e0f213b2  /tmp/timer.patch.xz" | sha256sum -c -
          xz -dc /tmp/timer.patch.xz > /tmp/timer.patch
          git apply --check /tmp/timer.patch
          git apply /tmp/timer.patch
          rm -rf .bootstrap-update

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: qualify campaign interval timers"
          git push origin HEAD:feat/timer-qualification
