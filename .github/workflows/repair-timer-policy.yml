name: Repair timer qualification

on:
  push:
    branches: [feat/timer-qualification]
    paths:
      - ".github/workflows/repair-timer-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply reviewed timer-policy fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"target not found in {path_text}: {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/cpubench/models.py",
              '''    def with_semantic_id(self) -> Self:\n        data = self.model_dump(mode="python")\n        data["semantic_id"] = semantic_id(self.artifact_kind, self.schema_version, self.semantic_payload())\n        return self.__class__.model_validate(data)\n''',
              '''    def computed_semantic_id(self) -> str:\n        return semantic_id(self.artifact_kind, self.schema_version, self.semantic_payload())\n\n    def semantic_identity_is_valid(self) -> bool:\n        return self.semantic_id is not None and self.semantic_id == self.computed_semantic_id()\n\n    def with_semantic_id(self) -> Self:\n        data = self.model_dump(mode="python")\n        data["semantic_id"] = self.computed_semantic_id()\n        return self.__class__.model_validate(data)\n''',
          )

          replace(
              "src/cpubench/planner.py",
              '                        "profile_id": profile.profile_id,\n',
              '                        "profile_id": profile.semantic_id,\n',
          )
          replace(
              "src/cpubench/planner.py",
              '        profile_id=profile.profile_id,\n',
              '        profile_id=profile.semantic_id or "",\n',
          )

          replace(
              "src/cpubench/platform_probe.py",
              '''    try:\n        load_average: list[float] = list(os.getloadavg())\n    except (AttributeError, OSError):\n        load_average = []\n''',
              '''    getloadavg = cast(Callable[[], tuple[float, float, float]] | None, getattr(os, "getloadavg", None))\n    if getloadavg is None:\n        load_average: list[float] = []\n    else:\n        try:\n            load_average = list(getloadavg())\n        except OSError:\n            load_average = []\n''',
          )

          validation_path = Path("src/cpubench/validation.py")
          validation = validation_path.read_text(encoding="utf-8")
          function_start = validation.index("def _timer_outcome(")
          function_end = validation.index("\n\ndef _evaluate_obligation(", function_start)
          timer_outcome = '''def _timer_outcome(\n    attempt: AttemptRecord,\n    machine: MachineReceipt,\n    qualifications: dict[str, TimerQualification],\n) -> ObligationResult:\n    obligation_id = "instrument.timer_qualified"\n    timers = {sample.timer for sample in attempt.samples}\n    if not timers or "unknown" in timers:\n        return _result(obligation_id, ValidityOutcome.FAIL, "sample_timer_unknown")\n\n    timer_results: list[ObligationResult] = []\n    for timer in sorted(timers):\n        qualification = qualifications.get(timer)\n        if qualification is None:\n            state = _machine_timer_capability(timer, machine)\n            if state is None:\n                timer_results.append(\n                    _result(obligation_id, ValidityOutcome.INCONCLUSIVE, "sample_timer_not_mapped", f"timer={timer}")\n                )\n            elif state == CapabilityState.FAILED:\n                timer_results.append(\n                    _result(obligation_id, ValidityOutcome.FAIL, "timer_capability_failed", f"timer={timer}")\n                )\n            elif state in {CapabilityState.UNSUPPORTED, CapabilityState.UNKNOWN}:\n                timer_results.append(\n                    _result(obligation_id, ValidityOutcome.UNSUPPORTED, "timer_capability_unsupported", f"timer={timer}")\n                )\n            else:\n                timer_results.append(\n                    _result(\n                        obligation_id,\n                        ValidityOutcome.INCONCLUSIVE,\n                        "timer_control_missing",\n                        f"timer={timer}; run the matching timer-overhead control in the same campaign",\n                    )\n                )\n            continue\n\n        if qualification.state == CapabilityState.FAILED:\n            timer_results.append(\n                _result(obligation_id, ValidityOutcome.FAIL, qualification.reason_code, qualification.detail)\n            )\n            continue\n        if qualification.state in {CapabilityState.UNSUPPORTED, CapabilityState.UNKNOWN}:\n            timer_results.append(\n                _result(obligation_id, ValidityOutcome.UNSUPPORTED, qualification.reason_code, qualification.detail)\n            )\n            continue\n        if qualification.state == CapabilityState.AVAILABLE_UNQUALIFIED:\n            timer_results.append(\n                _result(obligation_id, ValidityOutcome.INCONCLUSIVE, qualification.reason_code, qualification.detail)\n            )\n            continue\n        if attempt.family_id in _TIMER_CONTROL_FAMILIES:\n            timer_results.append(_result(obligation_id, ValidityOutcome.PASS, "timer_control_qualified"))\n            continue\n\n        minimum = qualification.minimum_sample_duration_ns\n        if minimum is None:\n            timer_results.append(\n                _result(obligation_id, ValidityOutcome.INCONCLUSIVE, "timer_minimum_duration_missing")\n            )\n            continue\n        too_short = [\n            sample.elapsed_ns\n            for sample in attempt.samples\n            if sample.timer == timer and sample.elapsed_ns < minimum\n        ]\n        if too_short:\n            timer_results.append(\n                _result(\n                    obligation_id,\n                    ValidityOutcome.FAIL,\n                    "sample_below_minimum_timer_duration",\n                    f"timer={timer}; minimum_ns={minimum}; observed_ns={too_short}",\n                )\n            )\n        else:\n            timer_results.append(_result(obligation_id, ValidityOutcome.PASS, "timer_control_qualified"))\n\n    for outcome in (ValidityOutcome.FAIL, ValidityOutcome.INCONCLUSIVE, ValidityOutcome.UNSUPPORTED):\n        matching = [result for result in timer_results if result.outcome == outcome]\n        if matching:\n            return matching[0]\n    return _result(obligation_id, ValidityOutcome.PASS, "timer_control_qualified")\n'''
          validation = validation[:function_start] + timer_outcome + validation[function_end:]
          old_profile_load = '''    profile = ProfileSpec.model_validate_json((campaign_dir / "profile.json").read_text(encoding="utf-8"))\n    families = _load_families(campaign_dir)\n'''
          new_profile_load = '''    profile = ProfileSpec.model_validate_json((campaign_dir / "profile.json").read_text(encoding="utf-8"))\n    if not profile.semantic_identity_is_valid():\n        raise ValueError("profile semantic identity does not match its persisted content")\n    if profile.semantic_id != plan.profile_id:\n        raise ValueError("profile does not match the frozen run plan")\n    families = _load_families(campaign_dir)\n'''
          if old_profile_load not in validation:
              raise SystemExit("validation profile-load target not found")
          validation_path.write_text(validation.replace(old_profile_load, new_profile_load), encoding="utf-8")

          replace(
              "src/cpubench/campaign.py",
              '''        if profile_path.exists():\n            persisted_profile = ProfileSpec.model_validate_json(profile_path.read_text(encoding="utf-8"))\n            if persisted_profile.semantic_id != loaded.profile.semantic_id:\n                raise RuntimeError("profile changed; start a new campaign instead of resuming")\n''',
              '''        if profile_path.exists():\n            persisted_profile = ProfileSpec.model_validate_json(profile_path.read_text(encoding="utf-8"))\n            if not persisted_profile.semantic_identity_is_valid():\n                raise RuntimeError("persisted profile semantic identity does not match its content")\n            if persisted_profile.semantic_id != loaded.profile.semantic_id:\n                raise RuntimeError("profile changed; start a new campaign instead of resuming")\n''',
          )
          replace(
              "src/cpubench/campaign.py",
              '''    plan = RunPlan.model_validate_json((root / "run-plan.json").read_text(encoding="utf-8"))\n    expected_ids = {item.attempt_id for item in plan.items}\n''',
              '''    plan = RunPlan.model_validate_json((root / "run-plan.json").read_text(encoding="utf-8"))\n    profile = ProfileSpec.model_validate_json((root / "profile.json").read_text(encoding="utf-8"))\n    if not profile.semantic_identity_is_valid():\n        raise RuntimeError("profile semantic identity does not match its persisted content")\n    if profile.semantic_id != plan.profile_id:\n        raise RuntimeError("profile does not match the frozen run plan")\n    expected_ids = {item.attempt_id for item in plan.items}\n''',
          )

          replace(
              "tests/e2e/test_campaign.py",
              'from cpubench.models import AttemptRecord, InstrumentRelease, PackRelease, RunPlan\n',
              'from cpubench.models import AttemptRecord, CapabilityState, InstrumentRelease, PackRelease, ProfileSpec, RunPlan\n',
          )
          replace(
              "tests/e2e/test_campaign.py",
              '''    assert {qualification.state.value for qualification in validation.timer_qualifications.values()} == {"qualified"}\n    assert "python.time.monotonic_ns" in validation.timer_qualifications\n    assert any(timer in validation.timer_qualifications for timer in {"CLOCK_MONOTONIC_RAW", "CLOCK_MONOTONIC", "QueryPerformanceCounter"})\n''',
              '''    assert "python.time.monotonic_ns" in validation.timer_qualifications\n    assert any(\n        timer in validation.timer_qualifications\n        for timer in {"CLOCK_MONOTONIC_RAW", "CLOCK_MONOTONIC", "QueryPerformanceCounter"}\n    )\n    for qualification in validation.timer_qualifications.values():\n        assert qualification.control_attempt_ids\n        if qualification.state == CapabilityState.QUALIFIED:\n            assert qualification.read_overhead_ns is not None\n            assert qualification.effective_resolution_ns is not None\n            assert qualification.minimum_sample_duration_ns is not None\n        elif qualification.state == CapabilityState.AVAILABLE_UNQUALIFIED:\n            assert qualification.reason_code in {\n                "timer_positive_resolution_not_observed",\n                "timer_read_overhead_not_observed",\n            }\n        elif qualification.state == CapabilityState.FAILED:\n            assert (\n                qualification.non_monotonic_observations > 0\n                or qualification.failed_control_attempt_ids\n                or qualification.invalid_control_attempt_ids\n            )\n        else:\n            pytest.fail(f"unexpected timer qualification state: {qualification.state}")\n''',
          )

          e2e_path = Path("tests/e2e/test_campaign.py")
          e2e = e2e_path.read_text(encoding="utf-8")
          if "test_validation_rejects_profile_that_differs_from_frozen_plan" not in e2e:
              e2e += '''\n\ndef _write_profile_policy_campaign(tmp_path: Path, campaign_id: str) -> Path:\n    campaign_file = tmp_path / f"{campaign_id}.yaml"\n    campaign_file.write_text(\n        yaml.safe_dump(\n            {\n                "schema_version": 1,\n                "artifact_kind": "campaign_spec",\n                "campaign_id": campaign_id,\n                "title": "Profile policy binding",\n                "description": "Reject changed validation policy.",\n                "profile": "profiles/smoke.yaml",\n                "packs": [{"pack": "packs/controls/pack.yaml"}],\n                "operating_mode": "characterization",\n                "implementation_policy": "native",\n                "placement": "scheduler_open",\n                "output_root": str(tmp_path / "runs"),\n                "schedule_seed": 1,\n                "public_claims_enabled": False,\n            },\n            sort_keys=False,\n        ),\n        encoding="utf-8",\n    )\n    return campaign_file\n\n\ndef test_validation_rejects_profile_that_differs_from_frozen_plan(tmp_path: Path) -> None:\n    runtime = prepare_runtime(_write_profile_policy_campaign(tmp_path, "profile-binding"), resume=True)\n    persist_runtime(runtime)\n    profile_path = runtime.store.root / "profile.json"\n    profile = ProfileSpec.model_validate_json(profile_path.read_text(encoding="utf-8"))\n    changed = profile.model_copy(\n        update={\n            "minimum_timer_overhead_ratio": profile.minimum_timer_overhead_ratio + 10.0,\n            "semantic_id": None,\n        }\n    ).with_semantic_id()\n    profile_path.write_text(changed.model_dump_json(exclude_none=True, indent=2) + "\\n", encoding="utf-8")\n\n    with pytest.raises(ValueError, match="profile does not match the frozen run plan"):\n        validate_campaign(runtime.store.root)\n\n\ndef test_validation_rejects_profile_with_stale_semantic_identity(tmp_path: Path) -> None:\n    runtime = prepare_runtime(_write_profile_policy_campaign(tmp_path, "profile-tamper"), resume=True)\n    persist_runtime(runtime)\n    profile_path = runtime.store.root / "profile.json"\n    profile = ProfileSpec.model_validate_json(profile_path.read_text(encoding="utf-8"))\n    stale = profile.model_copy(\n        update={"minimum_timer_overhead_ratio": profile.minimum_timer_overhead_ratio + 10.0}\n    )\n    profile_path.write_text(stale.model_dump_json(exclude_none=True, indent=2) + "\\n", encoding="utf-8")\n\n    with pytest.raises(ValueError, match="profile semantic identity"):\n        validate_campaign(runtime.store.root)\n'''
              e2e_path.write_text(e2e, encoding="utf-8")

          replace(
              "tests/unit/test_planner.py",
              '''    assert [item.attempt_id for item in first.items] == [item.attempt_id for item in second.items]\n    assert len(first.items) >= 4\n''',
              '''    assert [item.attempt_id for item in first.items] == [item.attempt_id for item in second.items]\n    assert first.profile_id == loaded.profile.semantic_id\n    assert len(first.items) >= 4\n''',
          )

          timer_test_path = Path("tests/unit/test_timer_qualification.py")
          timer_tests = timer_test_path.read_text(encoding="utf-8")
          if "test_timer_failure_precedes_unmapped_timer_regardless_of_iteration_order" not in timer_tests:
              timer_tests += '''\n\ndef test_timer_failure_precedes_unmapped_timer_regardless_of_iteration_order() -> None:\n    control_item = _item("control", "controls.timer_overhead")\n    qualifications = _derive_timer_qualifications(\n        _plan(control_item),\n        {"control": _attempt("control", elapsed_ns=10_000)},\n        _profile(ratio=100.0),\n        _machine(),\n    )\n    target = _attempt(\n        "target",\n        timer="unmapped.timer",\n        elapsed_ns=10_000,\n        completed_units=1,\n        family_id="memory.dependent_load_latency",\n    )\n    target = target.model_copy(\n        update={\n            "samples": [\n                target.samples[0],\n                target.samples[0].model_copy(\n                    update={\n                        "sample_index": 1,\n                        "timer": "python.time.monotonic_ns",\n                        "elapsed_ns": 1_000,\n                    }\n                ),\n            ],\n            "semantic_id": None,\n        }\n    ).with_semantic_id()\n\n    outcome = _timer_outcome(target, _machine(), qualifications)\n\n    assert outcome.outcome == ValidityOutcome.FAIL\n    assert outcome.reason_code == "sample_below_minimum_timer_duration"\n'''
              timer_test_path.write_text(timer_tests, encoding="utf-8")

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          ruff check .
          mypy src/cpubench
          pytest -q
          python scripts/check_schemas.py
          python scripts/check_docs.py
          python scripts/check_yaml.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "fix: bind timer qualification to frozen policy"
          git push origin HEAD:feat/timer-qualification
